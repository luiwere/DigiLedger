services:
  - type: web
    name: lejasmart
    runtime: go
    buildCommand: go build -o lejasmart .
    startCommand: ./lejasmart
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        value: postgres://USER:PASSWORD@HOST:5432/lejasmart?sslmode=require
      - key: OWNER_DATABASE_URL
        value: postgres://USER:PASSWORD@HOST:5432/lejasmart_owner?sslmode=require
        